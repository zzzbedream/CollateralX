[package]
name = "collateral-x-valuation"
version = "0.1.0"
edition = "2021"
description = "CollateralX — Asset valuation engine for PYMES collateral, built on Arbitrum Stylus"

[dependencies]
alloy-primitives = { version = "1.0.1", features = ["tiny-keccak"] }
alloy-sol-types = { version = "1.0.1", features = ["json"] }

# stylus-sdk is an optional dependency, only enabled for the actual contract build.
# Tests run the pure valuation logic without any WASM host dependencies.
stylus-sdk = { version = "0.10.0", optional = true }

[dev-dependencies]
tokio = "1"

[features]
# The "contract" feature enables the full Stylus contract (default for cargo build)
default = ["contract"]
contract = ["stylus-sdk"]
export-abi = ["contract", "stylus-sdk/export-abi"]

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "s"
